<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Burgers, fries and fried chicken" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          Burgers and Fries</label
        >
      </div>
      <div class="food-item">
        <img src="food/eggs.jpeg" alt="eggs"/>
        <label
          ><input type="checkbox" name="food" value="hotdog" /> Eggs </label
        >
      </div>
      <div class="food-item">
        <img src="food/south indian.jpeg" alt="south indian" />
        <label
          ><input type="checkbox" name="food" value="Korean food" /> South Indian </label
        >
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="pasta" />
        <label><input type="checkbox" name="food" value="pasta" /> pasta</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="food/north indian.jpeg" alt="north indian" />
        <label><input type="checkbox" name="food" value="salad" /> North Indian </label>
      </div>
      <div class="food-item">
        <img src="food/chinese.jpeg" alt="chinese" />
        <label><input type="checkbox" name="food" value="steak" /> Chinese </label>
      </div>
      <div class="food-item">
        <img src="food/me.jpeg" alt="sushi" />
        <label><input type="checkbox" name="food" value="sushi" /> Me </label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue Hihihhh... 
    </button>
  </body>
</html>
