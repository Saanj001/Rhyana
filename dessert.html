<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">Which dessert we eatin pengu</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/rajbhogh.jpeg" alt="rajbhogh" />
        <label
          ><input type="checkbox" name="dessert" value="boba" /> Rajbhogh Ice Cream</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/creamroll.jpeg" alt="creamroll" />
        <label
          ><input type="checkbox" name="dessert" value="churro" /> CreamRoll</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/gulabjamun.jpeg" alt="gulabjamun" />
        <label><input type="checkbox" name="dessert" value="che" /> Gulab Jamun</label>
      </div>
      <div class="dessert-item">
        <img src="food/rabdi.jpeg" alt="rabdi" />
        <label
          ><input type="checkbox" name="dessert" value="mochi" /> Rabdi</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/yours.jpeg" alt="Me" />
        <label
          ><input type="checkbox" name="dessert" value="taiyaki" />
          Me</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities.html'">
      Continue UwU
    </button>
  </body>
</html>
