<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Rhythm 💖</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #fff0e3, #ffe6d6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Georgia", serif;
  }

  .card {
    max-width: 760px;
    padding: 46px 40px 52px;
    text-align: center;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 26px;
    box-shadow:
      0 30px 80px rgba(255, 150, 150, 0.25),
      inset 0 0 40px rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
  }

  .play-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    box-shadow: 0 10px 25px rgba(255, 120, 120, 0.45);
    cursor: pointer;
    margin-bottom: 26px;
  }

  .play-btn:active {
    transform: scale(0.95);
  }

  .play-btn::before {
    content: "▶";
    color: white;
    font-size: 26px;
    margin-left: 4px;
  }

  #text {
    font-size: 21px;
    line-height: 1.7;
    color: #e97c7c;
    min-height: 200px;
  }

  .heart {
    margin-top: 30px;
    font-size: 42px;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
  }
</style>
</head>

<body>

<div class="card">

  <!-- PLAY BUTTON -->
  <button class="play-btn" id="playBtn"></button>

  <!-- TEXT -->
  <div id="text">
    You’ve got my heart beating faster than a Quick Attack.
    I didn’t even need a Master Ball to know you’re the most legendary catch ever.
    You’re my favorite shiny, and I choose you today and every day.
    It’s official: you’re now my boyfriend and my Valentine. 💖
  </div>

  <!-- HEART (POKÉMON-ENERGY, SHY & CUTE) -->
  <div class="heart">💗</div>

</div>

<!-- MUSIC -->
<audio id="music">
  <source src="music/cant-help-falling-in-love.mp3" type="audio/mpeg">
</audio>

<script>
  const playBtn = document.getElementById("playBtn");
  const music = document.getElementById("music");
  const textBox = document.getElementById("text");
  const fullText = textBox.innerText.trim();

  textBox.innerText = "";
  let i = 0;

  // Song is slow → type slower (romantic sync)
  const typingSpeed = 65;

  function typeText() {
    if (i < fullText.length) {
      textBox.innerHTML += fullText.charAt(i);
      i++;
      setTimeout(typeText, typingSpeed);
    }
  }

  playBtn.addEventListener("click", () => {
    playBtn.style.display = "none";
    music.play();
    typeText();
  });
</script>

</body>
</html>
