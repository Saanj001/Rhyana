<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Rhythm 💖</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #fff0e3, #ffe1cf);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Georgia", serif;
    overflow: hidden;
  }

  /* Floating hearts background */
  .heart-bg span {
    position: absolute;
    bottom: -50px;
    font-size: 18px;
    animation: floatUp 12s linear infinite;
    opacity: 0.35;
  }

  .heart-bg span:nth-child(1) { left: 10%; animation-delay: 0s; }
  .heart-bg span:nth-child(2) { left: 30%; animation-delay: 4s; }
  .heart-bg span:nth-child(3) { left: 50%; animation-delay: 2s; }
  .heart-bg span:nth-child(4) { left: 70%; animation-delay: 6s; }
  .heart-bg span:nth-child(5) { left: 90%; animation-delay: 1s; }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); }
    100% { transform: translateY(-110vh) scale(1.2); }
  }

  .card {
    position: relative;
    max-width: 760px;
    padding: 48px 42px 56px;
    text-align: center;
    background: rgba(255,255,255,0.6);
    border-radius: 30px;
    box-shadow:
      0 30px 80px rgba(255, 140, 140, 0.35),
      inset 0 0 45px rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    z-index: 2;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  .ctrl {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 20px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: white;
    box-shadow: 0 10px 22px rgba(255,120,120,0.45);
  }

  .ctrl:active { transform: scale(0.92); }

  #text {
    font-size: 21px;
    line-height: 1.7;
    color: #e97c7c;
    min-height: 200px;
  }

  /* Pikachu GIF animation */
  .pikachu {
    margin-top: 28px;
    animation: floatPika 3.5s ease-in-out infinite;
  }

  .pikachu img {
    width: 160px;
    filter: drop-shadow(0 12px 22px rgba(255,150,150,0.6));
    border-radius: 18px;
  }

  @keyframes floatPika {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<body>

<!-- Floating hearts -->
<div class="heart-bg">
  <span>💗</span><span>💖</span><span>💞</span><span>💓</span><span>💘</span>
</div>

<div class="card">

  <!-- CONTROLS -->
  <div class="controls">
    <button class="ctrl" id="play">▶</button>
    <button class="ctrl" id="pause">⏸</button>
    <button class="ctrl" id="stop">⏹</button>
  </div>

  <!-- TEXT -->
  <div id="text">
    You’ve got my heart beating faster than a Quick Attack.
    I didn’t even need a Master Ball to know you’re the most legendary catch ever.
    You’re my favorite shiny, and I choose you today and every day.
    It’s official: you’re now my boyfriend and my Valentine. 💖
  </div>

  <!-- PIKACHU GIF -->
  <div class="pikachu">
    <img src="https://media.tenor.com/e1y0uPpvw1gAAAAM/pika-pika-kiss-pikachu.gif" alt="pikachu kiss" />
  </div>

</div>

<!-- MUSIC -->
<audio id="music">
  <source src="music/cant-help-falling-in-love.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById("music");
  const textBox = document.getElementById("text");
  const fullText = textBox.innerText.trim();

  const playBtn = document.getElementById("play");
  const pauseBtn = document.getElementById("pause");
  const stopBtn = document.getElementById("stop");

  textBox.innerText = "";
  let i = 0;
  let typing;

  function typeText() {
    if (i < fullText.length) {
      textBox.innerHTML += fullText.charAt(i);
      i++;
      typing = setTimeout(typeText, 65);
    }
  }

  playBtn.onclick = () => {
    if (music.paused) {
      music.play();
      if (i === 0) typeText();
    }
  };

  pauseBtn.onclick = () => {
    music.pause();
    clearTimeout(typing);
  };

  stopBtn.onclick = () => {
    music.pause();
    music.currentTime = 0;
    clearTimeout(typing);
    textBox.innerText = "";
    i = 0;
  };
</script>

</body>
</html>
