<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>For You 💛</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #fff4ea, #ffe2d1);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Georgia", serif;
    overflow: hidden;
  }

  /* Floating sparkles */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffd1dc;
    border-radius: 50%;
    animation: sparkleFloat 6s infinite ease-in-out;
    opacity: 0.6;
  }

  @keyframes sparkleFloat {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    30% { opacity: 0.6; }
    100% { transform: translateY(-120vh) scale(1); opacity: 0; }
  }

  .card {
    width: 360px;
    max-width: 92%;
    background: rgba(255,255,255,0.7);
    border-radius: 28px;
    padding: 26px 22px 34px;
    box-shadow:
      0 30px 90px rgba(255, 150, 120, 0.4),
      inset 0 0 50px rgba(255,255,255,0.6);
    text-align: center;
    position: relative;
    z-index: 2;
    backdrop-filter: blur(10px);
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border: none;
    font-size: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 140, 140, 0.5);
  }

  .btn:active { transform: scale(0.92); }

  /* Text */
  #text {
    color: #e97c7c;
    font-size: 16px;
    line-height: 1.65;
    min-height: 130px;
    margin-top: 6px;
  }

  /* Pikachu zone */
  .pikachu-zone {
    position: relative;
    height: 260px;
    margin-top: 18px;
  }

  .pika-main {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    animation: floatPika 3.5s ease-in-out infinite;
  }

  .pika-main img {
    width: 260px;
    filter:
      drop-shadow(0 0 30px rgba(255, 200, 120, 0.9))
      drop-shadow(0 25px 45px rgba(255, 160, 120, 0.6));
  }

  @keyframes floatPika {
    0% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-10px); }
    100% { transform: translateX(-50%) translateY(0); }
  }

  /* Fade to black */
  .fadeout {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #ffd6e8;
    letter-spacing: 1px;
    z-index: 10;
    transition: opacity 3s ease;
  }

  .fadeout.show {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>

<body>

<!-- Sparkles -->
<script>
  for (let i = 0; i < 20; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDelay = Math.random() * 6 + "s";
    document.body.appendChild(s);
  }
</script>

<div class="card">

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="play">▶</button>
    <button class="btn" id="pause">⏸</button>
    <button class="btn" id="stop">⏹</button>
  </div>

  <!-- Text -->
  <div id="text"></div>

  <!-- Pikachu -->
  <div class="pikachu-zone">
    <div class="pika-main">
      <img src="https://media.tenor.com/Q7GexxazmCQAAAAM/pikachu-pokemon.gif" />
    </div>
  </div>

</div>

<!-- Fade End -->
<div class="fadeout" id="fadeEnd">
  The End 💘
</div>

<!-- Music -->
<audio id="music">
  <source src="music/cant-help-falling-in-love.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById("music");
  const textBox = document.getElementById("text");
  const fadeEnd = document.getElementById("fadeEnd");

  const lines = [
    "Wise men say, only fools rush in…",
    "But I can’t help falling in love with you.",
    "You’ve got my heart beating faster than a Quick Attack.",
    "You’re my favorite shiny.",
    "And I choose you — today and every day. 💛"
  ];

  let line = 0;
  let char = 0;

  function typeLine() {
    if (char < lines[line].length) {
      textBox.innerHTML += lines[line].charAt(char);
      char++;
      setTimeout(typeLine, 55);
    } else {
      setTimeout(() => {
        textBox.innerHTML += "<br/><br/>";
        line++;
        char = 0;
        if (line < lines.length) typeLine();
      }, 700);
    }
  }

  document.getElementById("play").onclick = () => {
    music.play();
    if (textBox.innerHTML === "") typeLine();
  };

  document.getElementById("pause").onclick = () => music.pause();

  document.getElementById("stop").onclick = () => {
    music.pause();
    music.currentTime = 0;
    textBox.innerHTML = "";
    line = 0;
    char = 0;
  };

  music.addEventListener("ended", () => {
    fadeEnd.classList.add("show");
  });
</script>

</body>
</html>
