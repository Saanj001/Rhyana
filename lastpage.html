<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Rhythm 💖</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff6e8;
      font-family: "Georgia", serif;
    }

    .card {
      max-width: 820px;
      padding: 40px 32px;
      text-align: center;
      background: rgba(255, 182, 193, 0.2);
      border-radius: 24px;
      box-shadow:
        0 0 40px rgba(255, 160, 180, 0.35),
        inset 0 0 25px rgba(255, 255, 255, 0.3);
    }

    audio {
      margin-bottom: 22px;
      width: 100%;
    }

    #typeText {
      font-size: 20px;
      line-height: 1.65;
      color: #f28c8c;
      margin: 0;
      min-height: 180px;
    }

    .gif {
      margin-top: 26px;
    }

    .gif img {
      width: 160px;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- AUDIO CONTROLS -->
    <audio id="bgMusic" controls>
      <source src="music/cant-help-falling-in-love.mp3" type="audio/mpeg" />
      Your browser does not support audio.
    </audio>

    <!-- TEXT -->
    <p id="typeText">
      You’ve got my heart beating faster than a Quick Attack.
      I didn’t even need a Master Ball to know you’re the most legendary catch ever.
      You’re my favorite shiny, and I choose you today and every day.
      It’s official: you’re now my boyfriend and my Valentine! 💖
    </p>

    <!-- CUTE GIF -->
    <div class="gif">
      <!-- Cute shy Pokémon (Pikachu / Eevee style) -->
      <img
        src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif"
        alt="shy cute pokemon"
      />
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    const music = document.getElementById("bgMusic");
    const textElement = document.getElementById("typeText");
    const text = textElement.innerText;

    textElement.innerText = "";
    let i = 0;
    let started = false;

    function typeWriter() {
      if (i < text.length) {
        textElement.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 42);
      }
    }

    music.addEventListener("play", () => {
      if (!started) {
        started = true;
        typeWriter();
      }
    });
  </script>

</body>
</html>
