<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Rhythm 💖</title>

  <!-- Lottie -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff6e8;
      font-family: "Georgia", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #thankyou {
      max-width: 820px;
      padding: 44px 32px;
      text-align: center;
      font-size: 20px;
      line-height: 1.65;
      color: #f28c8c;
      background: rgba(255, 182, 193, 0.18);
      border-radius: 22px;
      box-shadow:
        0 0 45px rgba(255, 160, 180, 0.35),
        inset 0 0 25px rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
    }

    #typeText {
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.4px;
    }

    .lottie-wrap {
      margin-top: 24px;
    }
  </style>
</head>

<body>

  <!-- MUSIC (AUTOPLAY ATTEMPT) -->
  <audio
    id="bgMusic"
    src="music/cant-help-falling-in-love.mp3"
    autoplay
    muted
    playsinline>
  </audio>

  <!-- CONTENT -->
  <div id="thankyou">
    <p id="typeText">
      You’ve got my heart beating faster than a Quick Attack.
      I didn’t even need a Master Ball to know you’re the most legendary catch ever.
      You’re my favorite shiny, and I choose you today and every day.
      It’s official: you’re now my boyfriend and my Valentine! 💖
    </p>

    <div class="lottie-wrap">
      <lottie-player
        src="https://assets10.lottiefiles.com/packages/lf20_touohxv0.json"
        background="transparent"
        speed="0.6"
        style="width: 140px; height: 140px; margin: auto;"
        loop
        autoplay>
      </lottie-player>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const music = document.getElementById("bgMusic");
    const textElement = document.getElementById("typeText");
    const text = textElement.innerText;

    textElement.innerText = "";
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        textElement.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 42);
      }
    }

    window.onload = () => {
      // Try to autoplay immediately
      music.play().catch(() => {});
      setTimeout(() => {
        music.muted = false; // attempt unmute
      }, 600);

      typeWriter();
    };
  </script>

</body>
</html>
